# =============================================================================
# Pattern 5 -- Configuration Externalisation
#
# Values under the "app" prefix are bound to the AppConfig record and validated
# at startup via Jakarta Bean Validation constraints.
# =============================================================================

app:
  name: Task Manager
  default-page-size: 20
  task-defaults:
    default-priority: MEDIUM
    due-date-days-from-now: 7

# --- Spring configuration ----------------------------------------------------

spring:
  application:
    name: task-manager

  data:
    web:
      pageable:
        default-page-size: ${app.default-page-size}

  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.example.taskmanager: DEBUG
    org.springframework.web: INFO

---
# Profile: test
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    com.example.taskmanager: WARN
