# Every setting the application reads, with its default. Override through the environment.
app:
  wip-limit: ${WIP_LIMIT:3}

server:
  port: ${PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./taskboard}
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-enums-using-to-string: true
    deserialization:
      read-enums-using-to-string: true
