[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-manager"
version = "0.1.0"
description = "Reference implementation: 8 architectural patterns for AI-assisted development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "dependency-injector>=4.41,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:dependency_injector",
    "ignore::DeprecationWarning:pytest_asyncio",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
